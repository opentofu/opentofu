# ~/.ovh-kms/okms.yaml (override the path with the KMS_CONFIG environment variable).
# Any value below can also be set with the matching KMS_RESTAPI_* environment variable.
# mTLS is the default authentication method.
version: 1
profile: default
profiles:
  default:
    restapi:
      endpoint: https://eu-west-rbx.okms.ovh.net
      ca: /path/to/public-ca.crt # optional if the CA is in the system trust store
      auth:
        cert: /path/to/domain/cert.pem
        key: /path/to/domain/key.pem
