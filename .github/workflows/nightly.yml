name: Nightly Build

on:
  schedule:
    - cron: "0 1 * * *" # 1 AM UTC daily
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: # NOTE: Ensure this list EXACTLY matches the cache steps below and the release action 
          - {goos: "linux",   goarch: "amd64"}
          - {goos: "linux",   goarch: "arm64"}
          - {goos: "freebsd", goarch: "amd64"}
          - {goos: "openbsd", goarch: "amd64"}
          - {goos: "solaris", goarch: "amd64"}
          - {goos: "darwin",  goarch: "amd64"}
          - {goos: "darwin",  goarch: "arm64"}
          - {goos: "windows", goarch: "amd64"}
          - {goos: "windows", goarch: "arm64"}
    
    name: Build for ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ubuntu-latest
    environment: gpg
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: "Fetch source code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main 

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "${{ matrix.goos }}", goarch: "${{ matrix.goarch }}", tag: "${{ github.sha }}" }

      # Prepare the nightly version to be able to have it returned correctly when running `tofu --version`.
      - name: Prepare version file
        run: |
          commit_created_at=`git show --no-patch --format=%cd --date=format:%Y%m%d%H%M%S ${GITHUB_SHA}`
          short_commit=`git rev-parse --short=12 ${GITHUB_SHA}`
          sed -i "s/-dev/-nightly${commit_created_at}-${short_commit}/" version/VERSION


      - name: Run GoReleaser (Build)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          distribution: goreleaser-pro
          # Without single-target, only GOOS is used as a filter, not GOARCH
          args: release --nightly --skip=docker,sign --split --clean --single-target --timeout=60m --config=release/.goreleaser.yaml
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          RELEASE_FLAG_LATEST: "false" 
          RELEASE_FLAG_PRERELEASE: "true" 

  release:
    needs: [build]
    runs-on: "ubuntu-latest"
    name: "Nightly Release"
    environment: gpg

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main 

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "linux", goarch: "amd64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "linux", goarch: "arm64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "freebsd", goarch: "amd64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "openbsd", goarch: "amd64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "solaris", goarch: "amd64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "darwin", goarch: "amd64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "darwin", goarch: "arm64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "windows", goarch: "amd64", tag: "${{ github.sha }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "windows", goarch: "arm64", tag: "${{ github.sha }}"}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          distribution: goreleaser-pro
          # No need to specify config file here (not allowed) as it uses the config from the dists (undocumented)
          args: continue --skip=docker,sign --merge --timeout=60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          RELEASE_FLAG_LATEST: "false" 
          RELEASE_FLAG_PRERELEASE: "true" 

      - name: Setup dependencies
        run: sudo apt-get update && sudo apt-get install rclone jq

      - name: Prepare nightly artifacts
        run: |
          # Get today's date in YYYYMMDD format
          DATE=$(date +%Y%m%d)
          VERSION=$(grep -E '"version":' dist/linux_amd64/metadata.json | cut -d'"' -f4)
          COMMIT=$(git rev-parse --short=12 HEAD)

          # Create a staging directory for upload
          mkdir -p ./upload/nightlies/${DATE}

          find dist/

          # Copy relevant artifacts
          cp dist/*/*.tar.gz ./upload/nightlies/${DATE}/ 2>/dev/null || true
          cp dist/*/*.zip ./upload/nightlies/${DATE}/ 2>/dev/null || true
          cp dist/*SHA256SUMS* ./upload/nightlies/${DATE}/ 2>/dev/null || true

          # Create latest.json
          cat > ./upload/nightlies/latest.json <<EOF
          {
            "version": "${VERSION}",
            "date": "${DATE}",
            "commit": "${COMMIT}",
            "path": "/nightlies/${DATE}/",
            "artifacts": $(ls -1 ./upload/nightlies/${DATE}/*.{tar.gz,zip} 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          }
          EOF

          echo "nightly build artifacts for ${DATE} ready to upload"
          echo "Version: ${VERSION}"
          echo "Commit: ${COMMIT}"

      - name: Sync to R2
        run: |
          set -euo pipefail

          echo "Starting upload to R2..."
          echo "Files to upload:"
          find ./upload -type f -name "*.tar.gz" -o -name "*.zip" -o -name "*SHA256SUMS*" -o -name "*.json"
          
          if ! rclone copy --verbose ./upload/ R2:${{ secrets.R2_BUCKET_NAME }}; then
            echo "ERROR: Failed to upload artifacts to R2"
            exit 1
          fi

          echo "Successfully uploaded nightly build artifacts to R2"
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
